name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
      - run: python3 tools/test_collect_licenses.py
      - run: python3 tools/test_summarize_stats.py
      - name: Install XKB runtime for native keyboard regression
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0
      - run: cargo +stable test --manifest-path vendor/vnc-rs/Cargo.toml --locked --lib
      - run: cargo +stable test --manifest-path vendor/minifb/Cargo.toml --locked --lib fjern_
      - run: cargo +stable build --workspace --release --locked
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build and package tools
        run: pacman -Syu --noconfirm base-devel brotli clang cmake git hicolor-icon-theme libx11 libxkbcommon namcap nasm openssl pkgconf python rustup wayland zlib zstd
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --workspace --release --locked
      - run: cargo test --workspace --locked
      - name: Build release candidate archive
        run: tools/package-release.sh v0.2.1 x86_64-linux dist
      - name: Build and inspect Arch package
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum dist/fjern-v0.2.1-x86_64-linux.tar.gz | cut -d' ' -f1)"
          sed -i "s/^sha256sums=.*/sha256sums=('$digest')/" packaging/arch/PKGBUILD
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c 'cd "$1/packaging/arch" && SRCDEST="$1/dist" makepkg --clean --cleanbuild --force' _ "$GITHUB_WORKSPACE"
          namcap packaging/arch/PKGBUILD | tee namcap-recipe.log
          namcap packaging/arch/fjern-bin-*.pkg.tar.zst | tee namcap-package.log
          # namcap can report errors while returning success.
          python3 -c 'from pathlib import Path; import sys; sys.exit(any(" E:" in Path(p).read_text() for p in ("namcap-recipe.log", "namcap-package.log")))'
